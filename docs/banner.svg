<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="ReviewNudge: smart in-app review prompts for Android" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052e2b"/>
      <stop offset="1" stop-color="#0f3d2e"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <path id="s" d="M0 -22 L6.5 -7 L22 -6.8 L10 3.6 L13.6 19.5 L0 11 L-13.6 19.5 L-10 3.6 L-22 -6.8 L-6.5 -7 Z"/>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="228" fill="#ffffff" font-size="76" font-weight="800" letter-spacing="-2">ReviewNudge</text>
    <text x="82" y="282" fill="#bbf7d0" font-size="27" font-weight="500">Ask for Google Play reviews at the right moment,</text>
    <text x="82" y="318" fill="#bbf7d0" font-size="27" font-weight="500">and only then. Kotlin · Jetpack Compose</text>

    <g font-size="19" font-weight="600" fill="#ecfdf5">
      <rect x="82" y="356" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
      <text x="157" y="382" text-anchor="middle">✓ 5 launches</text>
      <rect x="244" y="356" width="130" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
      <text x="309" y="382" text-anchor="middle">✓ 3 days</text>
      <rect x="386" y="356" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1"/>
      <text x="461" y="382" text-anchor="middle">✓ 3 events</text>
      <rect x="548" y="356" width="120" height="40" rx="20" fill="#22c55e"/>
      <text x="608" y="382" text-anchor="middle" fill="#052e2b">Ask now</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="800" y="110" width="380" height="340" rx="28" fill="#ffffff"/>
      <rect x="836" y="146" width="56" height="56" rx="14" fill="#16a34a"/>
      <path d="M852 176 l10 10 l18 -20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="908" y="170" fill="#111827" font-size="22" font-weight="700">FitTrack</text>
      <text x="908" y="196" fill="#6b7280" font-size="17">Rate this app</text>
      <text x="836" y="252" fill="#374151" font-size="17">Tell others what you think.</text>
      <g fill="url(#star)">
        <use href="#s" x="866" y="304"/>
        <use href="#s" x="922" y="304"/>
        <use href="#s" x="978" y="304"/>
        <use href="#s" x="1034" y="304"/>
      </g>
      <use href="#s" x="1090" y="304" fill="none" stroke="#d1d5db" stroke-width="2.5"/>
      <rect x="836" y="360" width="308" height="1" fill="#e5e7eb"/>
      <text x="1030" y="410" fill="#16a34a" font-size="18" font-weight="700">Submit</text>
      <text x="920" y="410" fill="#6b7280" font-size="18" font-weight="600">Not now</text>
    </g>
  </g>
</svg>
